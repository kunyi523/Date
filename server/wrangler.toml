name = "xindong"
main = "worker.js"
compatibility_date = "2026-01-01"

# 面板上手工设的变量/密钥（比如 IP_SALT）在每次部署后保留，不被这个文件覆盖
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "xindong"
database_id = "09681607-3b3c-4f66-8005-58acf3bc5d11"
migrations_dir = "migrations"

# IP_SALT 不写在这里。在面板 Settings → Variables 里设成任意一串字符；
# 没设的话代码里有一个默认值，能跑，只是弱一点。
